name: Check
on:
  push:
  pull_request:
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
            python-version: "3.11"
      - name: Run basedpyright Type Checker
        run: uv run basedpyright
